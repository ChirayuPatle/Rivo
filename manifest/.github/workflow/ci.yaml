apiVersion: apps/v1
kind: Deployment
metadata:
  name: colour-picker
  labels:
    app: colour-picker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: colour-picker
  template:
    metadata:
      labels:
        app: colour-picker
    spec:
      containers:
        - name: colour-picker
          image: chirayupatle/colour-picker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: colour-picker
  labels:
    app: colour-picker
spec:
  type: NodePort
  selector:
    app: colour-picker
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
